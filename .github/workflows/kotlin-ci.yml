# Copyright Diametrical Ltd.
#
# The first CI this repo has had. Two gates, both previously unreachable in
# automation:
#
#   1. the corpus decode harness — `main()`-driven, so the `test` task never ran
#      it; before the `:fuaran-ui:corpusCheck` task it needed `kotlinc` on PATH;
#   2. the `:fuaran-renderer` Compose/Robolectric render-coverage gate — which
#      `run.ps1` does not cover at all (that script drives `kotlinc` over
#      `fuaran-ui` + `fuaran-core` only) and which needs Gradle + the Android SDK.
#
# Deliberately NO path filters. This repo had no CI, so the priority is that the
# gates run at all; a filtered workflow that silently never triggers is the
# failure mode this estate has already hit once (fuaran-swift went three days
# red-but-untriggered after the corpus repo split).
name: kotlin-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── The corpus is PINNED (Phase 1703) ──────────────────────────────────
      # `corpus-pin.json` records the one corpus revision this repository's gates
      # certify against. Before it, this job checked the corpus out at whatever was
      # current, so any corpus-side phase reddened this repository with no commit
      # of its own — which is not a signal about this code at all, and is the
      # reason a red here stopped meaning anything for days at a time.
      #
      # Full depth: `rev-list --count` needs BOTH ends of the range, and a depth-1
      # checkout holds neither the pinned commit nor `origin/main`, so the drift
      # report would answer "unknown" on every run.
      - name: Read the pinned corpus revision
        id: pin
        run: |
          # The only 40-character hex run in the file is the commit, so `grep -o`
          # reads it with no capture group.
          ref=$(grep -o '[0-9a-f]\{40\}' corpus-pin.json | head -1)
          test -n "$ref" || {
            echo "::error::corpus-pin.json records no 40-character authorityCommit — the corpus checkout below has nothing to pin to"
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "corpus pinned at $ref"

      - name: Checkout wire-format-fixtures corpus
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          ref: ${{ steps.pin.outputs.ref }}
          fetch-depth: 0
          path: _corpus

      # ASSERT the checkout is at the pin, then REPORT how far the pin is behind the
      # corpus's real head. Two different claims, and both are needed: without the
      # assert, dropping the `ref:` above would silently return this job to
      # certifying against whatever is current and every gate would stay green;
      # without the report, the pin would make drift invisible instead of
      # deliberate, which is a worse trade than the red it replaced.
      #
      # Drift is a NOTICE, not a failure. Being behind is the ordinary resting state
      # between a fixture being authored and the decoder work that adopts it.
      - name: Corpus pin — assert the checkout, report the drift
        run: |
          set +e
          pwsh -NoProfile -File dev-scripts/corpus-pin.ps1 -Authority "$GITHUB_WORKSPACE/_corpus" -Assert
          rc=$?
          set -e
          case "$rc" in
            0) echo "corpus pin current." ;;
            2) echo "::notice::the corpus has moved past this repository's pin (see the distance above). Adopting it is a deliberate change-set." ;;
            3) echo "::error::the corpus checkout is not at the pin — the gates below would certify against a revision this repository has not adopted"; exit 1 ;;
            *) echo "::warning::the corpus pin could not be measured (exit $rc)" ;;
          esac

      # BOTH gates skip cleanly when the corpus is absent — correct for a
      # standalone clone, and exactly how a gate ends up passing while checking
      # nothing. So prove it is here BEFORE running either.
      - name: Assert the corpus is present (a skipped gate is not a passing gate)
        id: corpus
        run: |
          test -f _corpus/manifest.json || {
            echo "::error::corpus manifest.json missing — the gates below would skip and report success"
            exit 1
          }
          echo "FUARAN_CORPUS=$GITHUB_WORKSPACE/_corpus" >> "$GITHUB_ENV"
          # "a corpus is present here, so its absence downstream is a DEFECT, not a
          # platform fact." The harnesses' own default is `return` on a missing
          # corpus, which is right for a standalone clone and is a vacuous green
          # here — and it was firing: a Gradle test JVM inherits no ambient
          # environment, so FUARAN_CORPUS above never reached gate 2, and its
          # derived `-Dfuaran.corpus` default names <repo>/../wire-format-fixtures,
          # which is not where this job puts the corpus. The render gate — the one
          # leg that exists BECAUSE it cannot run on the reference dev box — was
          # returning green having certified nothing.
          echo "FUARAN_REQUIRE_CORPUS=1" >> "$GITHUB_ENV"
          echo "corpus fixtures declared: $(grep -o '"id"' _corpus/manifest.json | wc -l)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK (compileSdk 36 for :fuaran-renderer)
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # Gate 0 — :fuaran-core COMPILES.
      #
      # Neither gate below reaches this module: gate 1 is :fuaran-ui, gate 2 is
      # :fuaran-renderer, and :fuaran-core's own test leg is a native round trip that
      # needs the Rust shim this runner has no toolchain to build. So the JNI adapter,
      # its Java `native` declarations and the C-ABI seam they implement were compiled
      # by NO gate here — a change to the bridge seam could break the module and CI
      # would report green, because nothing asked it to build.
      #
      # `testClasses` compiles main + test sources and RUNS nothing, which is exactly
      # the available claim: the shared library is absent, so the round trip cannot run,
      # but "does this still compile against the seam" is answerable and was not being
      # answered. Cheap, and it fails for the right reason.
      #
      # Phase 1703 added a `kotlin-native` job that RUNS that round trip, so this is no
      # longer the only gate reaching the module. Kept anyway, and not as a leftover:
      # this job carries no fuaran-rs checkout and no Rust build, so it answers the
      # compile question on a far shorter dependency chain - an ordinary Kotlin-side
      # break is reported here before the native job has finished fetching a crate
      # index.
      - name: Compile gate (:fuaran-core — the cheap half of the native module's build)
        run: ./gradlew :fuaran-core:testClasses --console=plain

      # Gate 1 — the wire-format corpus decode harness. Fails the build on any
      # failed check by its own exit code; the grep additionally refuses a run
      # that located no corpus, since that path exits 0.
      - name: Corpus decode gate (:fuaran-ui:corpusCheck)
        run: |
          set -o pipefail
          ./gradlew :fuaran-ui:corpusCheck --console=plain -Dfuaran.corpus="$FUARAN_CORPUS" | tee corpus.log
          if grep -q '^SKIP:' corpus.log; then
            echo "::error::the corpus harness SKIPPED — it found no corpus, so this gate checked nothing"
            exit 1
          fi

      # Gate 2 — the Compose render floor under Robolectric, plus the render-obligation
      # conformance gate's emitted-output leg (WIRE_FORMAT.md §13). This is the leg the
      # local Windows toolchain cannot run at all (AF_UNIX is blocked under
      # %LOCALAPPDATA% there, so every Gradle build task dies on its worker IPC),
      # which is the main reason this workflow exists.
      #
      # It runs even when gate 1 is red, and that is deliberate rather than lax. The two
      # gates cover different modules and different contracts, so a step ordering that
      # let a standing decode failure MASK a render failure would leave the only leg
      # nobody can run locally unreported for as long as the other stayed red — one
      # level down from the "a gate that silently never triggers" failure this
      # workflow's header already warns about. Both gates report; the job still fails if
      # either does.
      #
      # Conditioned on the corpus assertion above rather than on `always()`: with no
      # corpus both gates skip cleanly, and a skip standing in for a run is exactly what
      # that assertion exists to prevent.
      #
      # It FORWARDS THE CORPUS the way gate 1 does. It used not to, and the
      # `build.gradle.kts` default it fell back on names a sibling path this job
      # does not use — so the harnesses found nothing and `return`ed green. That
      # is now impossible from two directions at once: the path is passed
      # explicitly, and FUARAN_REQUIRE_CORPUS makes a miss FAIL rather than skip.
      - name: Render-coverage + render-obligation gate (:fuaran-renderer:testDebugUnitTest)
        if: always() && steps.corpus.outcome == 'success'
        run: ./gradlew :fuaran-renderer:testDebugUnitTest --console=plain -Dfuaran.corpus="$FUARAN_CORPUS"

      # The go-red proof for the residue comparison. `conformance-residue.txt` names
      # the render obligations this surface owes and does not answer; the gate is red
      # for a CHANGE to that set in either direction, so both directions are exercised
      # here against a perturbed scratch copy — the committed file is never edited.
      #
      # Without this, the residue mechanism could be silently inert and the gate would
      # stay green: exactly the class this whole workflow is being hardened against.
      - name: Residue gate go-red proof (both directions)
        if: always() && steps.corpus.outcome == 'success'
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/residue"
          mkdir -p "$scratch"

          # 1. WITHHELD: an owed obligation that the residue does not name reads as a
          #    regression. Strip every entry.
          grep -v '^\[obligation\]' conformance-residue.txt > "$scratch/withheld.txt"
          if FUARAN_RESIDUE="$scratch/withheld.txt" ./gradlew :fuaran-renderer:testDebugUnitTest                --console=plain --rerun-tasks -Dfuaran.corpus="$FUARAN_CORPUS"; then
            echo "::error::an empty residue set did NOT read as a regression — the comparison is inert"
            exit 1
          fi
          echo "go-red 1 OK: an unnamed owed obligation reds the gate."

          # 2. STALE: a residue entry nothing owes reads as a stale cap.
          cp conformance-residue.txt "$scratch/stale.txt"
          echo '[obligation] ZZNoSuchKind/no-such-claim' >> "$scratch/stale.txt"
          if FUARAN_RESIDUE="$scratch/stale.txt" ./gradlew :fuaran-renderer:testDebugUnitTest                --console=plain --rerun-tasks -Dfuaran.corpus="$FUARAN_CORPUS"; then
            echo "::error::a residue entry that cannot be owed did NOT read as stale"
            exit 1
          fi
          echo "go-red 2 OK: a stale residue entry reds the gate."

      # The corpus-required proof: with FUARAN_REQUIRE_CORPUS set and no corpus, the
      # render gate must FAIL rather than return green. This is the exact condition
      # that stood on every run of this workflow before today.
      - name: Corpus-required go-red proof (a missing corpus must fail, not skip)
        if: always() && steps.corpus.outcome == 'success'
        run: |
          set -uo pipefail
          if FUARAN_CORPUS="$RUNNER_TEMP/definitely-not-a-corpus" ./gradlew                :fuaran-renderer:testDebugUnitTest --console=plain --rerun-tasks                -Dfuaran.corpus="$RUNNER_TEMP/definitely-not-a-corpus"; then
            echo "::error::the render gate PASSED with no corpus — a skip is still reading as a pass"
            exit 1
          fi
          echo "go-red 3 OK: a missing corpus fails the render gate instead of skipping it." 

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore

  # ── The JNI shim, compiled; and the live session, round-tripped (Phase 1703) ──
  #
  # Two claims this repository could not make before, and they are different claims:
  #
  #   1. the hand-written C JNI shim COMPILES against the C-ABI header. It is built by
  #      no gate anywhere — `run.ps1`'s desktop leg needs a Rust toolchain and a C
  #      compiler, the Android AAR leg needs the NDK, and the `kotlin` job above
  #      compiles only Kotlin and Java. So a signature drift in `fuaran.h` reached
  #      whoever next built an Android release, as a link-time or run-time fault on a
  #      device, with nothing pointing back at the header change that caused it.
  #   2. a Kotlin session PERFORMS the five placement verbs against the real core. The
  #      round-trip tests existed and ran nowhere: `:fuaran-core:test` was invoked by no
  #      workflow, and its classes skip without a shim.
  #
  # ubuntu-latest, not macOS: this is a desktop-native leg and a Linux runner carries
  # rustup, a C compiler and a JDK at a tenth of the macOS rate. What it certifies —
  # that the declarations agree and the round trip works — is not platform-specific.
  kotlin-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fuaran-kt
        uses: actions/checkout@v4
        with:
          path: fuaran-kt

      - name: Checkout fuaran-rs (sibling reference core)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-rs
          path: fuaran-rs

      - name: Read the pinned corpus revision
        id: pin
        run: |
          # The only 40-character hex run in the file is the commit, so `grep -o`
          # reads it with no capture group.
          ref=$(grep -o '[0-9a-f]\{40\}' fuaran-kt/corpus-pin.json | head -1)
          test -n "$ref" || {
            echo "::error::corpus-pin.json records no 40-character authorityCommit"
            exit 1
          }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "corpus pinned at $ref"

      - name: Checkout wire-format-fixtures corpus (at the pin)
        uses: actions/checkout@v4
        with:
          repository: fuaran-ui/fuaran-ui-specification
          ref: ${{ steps.pin.outputs.ref }}
          fetch-depth: 0
          path: wire-format-fixtures

      - name: Corpus pin — assert the checkout, report the drift
        working-directory: fuaran-kt
        run: |
          set +e
          pwsh -NoProfile -File dev-scripts/corpus-pin.ps1 -Authority "$GITHUB_WORKSPACE/wire-format-fixtures" -Assert
          rc=$?
          set -e
          case "$rc" in
            0) echo "corpus pin current." ;;
            2) echo "::notice::the corpus has moved past this repository's pin (distance above)." ;;
            3) echo "::error::the corpus checkout is not at the pin"; exit 1 ;;
            *) echo "::warning::the corpus pin could not be measured (exit $rc)" ;;
          esac

      # BEFORE the compile, so a header change is reported as a header change rather
      # than as whatever the compiler says about it two steps later. This is the leg
      # `run.ps1` performs locally and no workflow performed at all: the `kotlin` job
      # above has no fuaran-rs checkout, so it is structurally unable to compare.
      - name: C-ABI header (fuaran.h) is byte-identical to the reference
        run: |
          copy=fuaran-kt/fuaran-core/src/main/jni/include/fuaran.h
          if ! cmp -s "$copy" fuaran-rs/include/fuaran.h; then
            echo "::error::fuaran.h has drifted from the reference core's header."
            echo "The copy is GENERATED. Regenerate it and read the diff:"
            echo "  cp fuaran-rs/include/fuaran.h $copy"
            diff -u "$copy" fuaran-rs/include/fuaran.h || true
            exit 1
          fi
          echo "fuaran.h byte-identical to the reference."

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The Gradle graph includes two Android modules, so a plain-JVM task still needs
      # the SDK at configuration time. Nothing here builds them.
      - name: Set up the Android SDK (the Gradle graph configures :fuaran-renderer)
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      # `javac -h` (JDK 21 has no `javah`) emits the JNI header from the `native`
      # declarations. The shim `#include`s it, so this must precede the compile.
      - name: Generate the JNI header (javac -h)
        working-directory: fuaran-kt
        run: |
          mkdir -p fuaran-core/src/main/jni/generated build/ci
          javac -h fuaran-core/src/main/jni/generated -d build/ci fuaran-core/src/main/java/fuaran/core/FuaranNative.java

      # Claim 1. Compile-only: the question "do these declarations still agree" is
      # answerable without a core to link against, and answering it separately is what
      # makes a drift report say *header* rather than *linker*.
      #
      # The two -Werror= flags are the ones that catch drift specifically: a verb
      # missing from the header becomes an implicit declaration, and a changed
      # signature becomes an incompatible pointer where the shim hands the function to
      # `one_document`. -Wall/-Wextra are informational — a stylistic warning must not
      # redden a gate about the ABI.
      - name: Compile gate — the JNI shim builds against the C-ABI header
        working-directory: fuaran-kt
        run: |
          cc -c -fPIC -O1 -Wall -Wextra -Werror=implicit-function-declaration -Werror=incompatible-pointer-types -I fuaran-core/src/main/jni -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" -o build/fuaran_jni.o fuaran-core/src/main/jni/fuaran_jni.c
          echo "JNI shim compiles against the header."

      # The go-red proof for claim 1. A gate that has never been seen to fail is a gate
      # nobody knows the polarity of — and this one's whole value is that it fails when
      # the header moves. Perturbs a SCRATCH copy; the committed header is untouched.
      - name: Compile gate go-red proof (a header that lost a verb must fail)
        working-directory: fuaran-kt
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/hdr-drift"
          rm -rf "$scratch"
          mkdir -p "$scratch"
          cp -r fuaran-core/src/main/jni/. "$scratch/"
          # Rename ONE declared verb in the scratch header: the shim's call to the real
          # name is then an implicit declaration, which is what a removed or renamed
          # C-ABI entry point looks like from here.
          sed -i 's/fuaran_session_place/fuaran_session_placed/' "$scratch/include/fuaran.h"
          if cc -c -fPIC -Werror=implicit-function-declaration -I "$scratch" -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" -o "$RUNNER_TEMP/drift.o" "$scratch/fuaran_jni.c" 2>/dev/null; then
            echo "::error::the shim compiled against a header missing a verb it calls — the #include is not load-bearing"
            exit 1
          fi
          echo "go-red OK: a header that no longer declares a verb the shim calls reds the compile gate."

      - name: Cache cargo + Rust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuaran-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('fuaran-rs/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build the Rust reference core
        working-directory: fuaran-rs
        run: cargo build

      # Linked against the cdylib rather than the staticlib, with `$ORIGIN` on the
      # runpath and the core staged beside the shim — the same two-file layout the
      # desktop dev script produces on Windows, so the loader resolves the dependency
      # from where the shim sits rather than from an ambient search path.
      - name: Link the JNI shim against the core
        working-directory: fuaran-kt
        run: |
          mkdir -p build/native
          cc -shared -o build/native/libfuaran_jni.so build/fuaran_jni.o -L "$GITHUB_WORKSPACE/fuaran-rs/target/debug" -lfuaran_rs -Wl,-rpath,'$ORIGIN'
          cp "$GITHUB_WORKSPACE/fuaran-rs/target/debug/libfuaran_rs.so" build/native/
          ls -l build/native

      # Claim 2. `-Pfuaran.requireNative=1` is what stops this reporting green by
      # skipping: the shim is right there, so an unloadable one is a failure, not a
      # platform fact. It is exactly the state this job would otherwise be in if the
      # path below were ever wrong.
      - name: Live-session round trip + the five placement verbs (:fuaran-core:test)
        working-directory: fuaran-kt
        run: |
          ./gradlew :fuaran-core:test --console=plain -Pfuaran.lib="$PWD/build/native/libfuaran_jni.so" -Pfuaran.requireNative=1

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-native-test-reports
          path: |
            fuaran-kt/**/build/reports/tests/**
            fuaran-kt/**/build/test-results/**
          if-no-files-found: ignore
